# agents/triage.yaml — read_only tier demo agent
name: "triage"
description: "Initial input triage and routing agent"
tier: "read_only"
provider: "mock"
model: "mock-1"
script: "agents/scripts/triage_mock.yaml"
system_prompt: |
  You are the triage agent for the keel runtime.
  Analyze the incoming report, classify it, and look up any prior context
  in the key-value store. You can READ context but you cannot write:
  your tier is read_only, so writing is structurally impossible.
tools:
  - db
max_turns: 3
